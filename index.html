function createMountain(){
 mountainCanvas=document.createElement('canvas');mountainCanvas.width=mountainCanvas.height=1000;
 const m=mountainCanvas.getContext('2d',{willReadFrequently:true});m.clearRect(0,0,1000,1000);

 const outline=[...ridge,[1100,1050],[-100,1050]];m.beginPath();m.moveTo(...outline[0]);for(let i=1;i<outline.length;i++)m.lineTo(...outline[i]);m.closePath();
 let rock=m.createLinearGradient(cx-430,summit,cx+450,990);rock.addColorStop(0,'#6b7b7d');rock.addColorStop(.42,'#465b63');rock.addColorStop(1,'#243942');m.fillStyle=rock;m.fill();m.save();m.clip();
 // Schuine breukvlakken: tientallen overlappende facetten in plaats van een egaal bergvlak.
 for(let j=0;j<390;j++){let x=R(-70,1070),y=R(summit,1000),w=R(16,125),h=R(12,125);let lit=(moonSide*(x-cx)<0);m.fillStyle=lit?['rgba(160,178,177,.12)','rgba(188,195,182,.13)','rgba(34,49,58,.18)'][j%3]:['rgba(17,30,40,.25)','rgba(81,104,107,.13)','rgba(27,44,53,.20)'][j%3];m.beginPath();m.moveTo(x,y);m.lineTo(x+w,y-R(12,50));m.lineTo(x+w*R(.3,.7),y+h);m.closePath();m.fill()}
 for(let j=0;j<2800;j++){let x=R(-60,1060),y=R(summit,1000),len=R(4,43);m.strokeStyle=['rgba(177,188,180,.19)','rgba(18,34,42,.31)','rgba(128,151,151,.17)'][j%3];m.lineWidth=R(.5,3);m.beginPath();m.moveTo(x,y);m.lineTo(x+len,y+R(-15,20));m.stroke()}
 for(let j=0;j<150;j++){let x=R(-50,1050),y=R(summit+50,950);m.strokeStyle='rgba(12,26,34,.25)';m.lineWidth=R(1,4);m.beginPath();m.moveTo(x,y);m.bezierCurveTo(x+R(-20,20),y+R(12,34),x+R(-30,30),y+R(30,70),x+R(-35,35),y+R(55,125));m.stroke()}m.restore();
 // De burcht staat ingebed in de rots; onregelmatige volumes en beschadigde daklijnen.
 const left=cx-140,right=cx+153;
 // Drie herkenbare, willekeurige kasteeltypes bij elk nieuw schilderij.
 const castleType=Math.floor(Math.random()*3);
 let walls,towers;
 if(castleType===0){ // vertrouwde middeleeuwse burcht
  walls=[{x:left,w:82,h:88},{x:left+64,w:76,h:115},{x:cx+15,w:94,h:98},{x:right-51,w:54,h:123}];

 }else if(castleType===1){ // verweerde ruïne met gebroken muren
  walls=[{x:left-12,w:83,h:64},{x:left+74,w:56,h:104},{x:cx+19,w:68,h:71},{x:right-37,w:40,h:91}];
  towers=[{x:left+12,w:37,h:132},{x:right-12,w:32,h:112}];
 }else{ // hoge donjon met lage ommuring

 }
 function stone(x,y,w,h,shade){

 }
 for(let q of walls)stone(q.x,floor-q.h,q.w,q.h,['#657679','#53666d','#607078','#4b5f68'][walls.indexOf(q)%4]);
 for(let t of towers){

  if(castleType!==1){ // ruïnetorens hebben geen intact dak
   m.fillStyle='#384e57';m.beginPath();
   m.moveTo(t.x-t.w*.7,floor-t.h+2);

 }
 if(castleType===1){

 }

 m.save();m.beginPath();for(let q of walls)m.rect(q.x,floor-q.h-4,q.w,q.h+4);for(let t of towers)m.rect(t.x-t.w/2,floor-t.h-5,t.w,t.h+5);m.clip();
 for(let j=0;j<2100;j++){let x=R(left-10,right+10),y=R(floor-190,floor);m.strokeStyle=j%3?'rgba(28,44,50,.27)':'rgba(190,200,186,.26)';m.lineWidth=R(.5,1.7);m.beginPath();m.moveTo(x,y);m.lineTo(x+R(4,18),y+R(-2,2));m.stroke()}
 for(let j=0;j<180;j++){let x=R(left,right),y=R(floor-150,floor);m.fillStyle='rgba(40,62,58,.20)';m.beginPath();m.ellipse(x,y,R(1,6),R(2,10),R(-1,1),0,7);m.fill()}m.restore();
 // Voet van de burcht verdwijnt gedeeltelijk achter vooruitspringende steenrichels.
 for(let j=0;j<35;j++){let x=R(left-30,right+30),y=R(floor-1,floor+38);m.fillStyle=j%2?'rgba(51,70,74,.8)':'rgba(75,92,93,.75)';m.beginPath();m.moveTo(x-R(16,35),y+R(7,20));m.lineTo(x,y-R(2,10));m.lineTo(x+R(13,39),y+R(5,17));m.closePath();m.fill()}

 // Laag 2 v3: extra geologische structuur: schuin gelaagde rotsen met

 m.save();m.beginPath();m.moveTo(...outline[0]);for(let i=1;i<outline.length;i++)m.lineTo(...outline[i]);m.closePath();m.clip();
 for(let j=0;j<420;j++){

  m.beginPath();m.moveTo(x,y);m.bezierCurveTo(x+length*.3,y+rise*.4,x+length*.7,y+rise*.9,x+length,y+rise);m.stroke();
 }
 // Verweerde schaduwpartijen in scheuren en spleten
 for(let j=0;j<90;j++){

 });

 grass.addColorStop(.24,'rgba(20,45,33,.86)');
 grass.addColorStop(1,'#132d23');

function beginMountain(){phase=2;painted=0;done=new Uint8Array(N);createMountain();ants.forEach(a=>{a.x=R(0,W);a.y=R(0,W)});running=true;document.getElementById('progress').textContent='Laag 2 · berg en kasteel · 0%'}

// LAAG 3: apart transparant doek. De eerste twee schilderlagen blijven exact gelijk.
function createBackTrees(){
 treeCanvas=document.createElement('canvas');treeCanvas.width=treeCanvas.height=W;
 const t=treeCanvas.getContext('2d',{willReadFrequently:true});
 // Laag 3: duidelijk herkenbare, koele donkergroene silhouetten vóór de berg.
 // De bomen zijn bewust veel donkerder dan het blauwgrijze gesteente.
 const count=115,trees=[];
 for(let i=0;i<count;i++){
  let x=(i+.5)*W/count+R(-13,13);
  let foot=R(735,820)+Math.sin(x*.007)*21+Math.sin(x*.018)*11;
  let height=R(68,155),width=height*R(.25,.44);
  trees.push({x,foot,height,width,kind:Math.random()});
 }
 trees.sort((a,b)=>a.foot-b.foot);
 for(const q of trees){
  let {x,foot,height:h,width:w,kind}=q;
  t.save();t.globalAlpha=R(.91,1);
  t.strokeStyle='#202e31';t.lineCap='round';t.lineWidth=R(2.2,4.3);
  t.beginPath();t.moveTo(x,foot);t.quadraticCurveTo(x+R(-5,5),foot-h*.5,x+R(-3,3),foot-h);t.stroke();
  if(kind<.70){
   // Naaldbomen met afzonderlijke, dichtbegroeide takken.
   for(let j=0;j<34;j++){
    let f=(j+.5)/34,y=foot-h*(.10+f*.88),reach=w*(1-f*.84)*R(.76,1.12);
    t.strokeStyle=['rgba(25,49,44,.98)','rgba(35,63,53,.97)','rgba(48,76,64,.94)'][j%3];
    t.lineWidth=R(2.2,4.5)*(1-f*.45);
    for(let side of [-1,1]){
     t.beginPath();t.moveTo(x+R(-2,2),y-R(2,7));
     t.quadraticCurveTo(x+side*reach*.48,y+R(-8,5),x+side*reach,y+R(0,12));t.stroke();
     for(let k=0;k<4;k++){let bx=x+side*reach*R(.22,.95);t.beginPath();t.moveTo(bx,y+R(-5,6));t.lineTo(bx+side*R(3,8),y-R(4,11));t.stroke()}
    }
   }
  }else{
   // Bladkruinen vormen echte donkere massa's, geen bleke stippen.
   for(let j=0;j<65;j++){
    let yy=foot-h*R(.45,.95),xx=x+R(-w,w),r=R(3.5,10);
    t.fillStyle=['rgba(27,53,47,.88)','rgba(37,67,56,.88)','rgba(52,82,68,.83)'][j%3];

   }

 }

const I=(a,b)=>Math.floor(R(a,b));
function createForest(){
 forestCanvas=document.createElement('canvas');forestCanvas.width=forestCanvas.height=W;
 const f=forestCanvas.getContext('2d',{willReadFrequently:true});
 // Laag 4 v4: 2 rijen, natuurlijke boomarchitectuur en duidelijk verschillende soorten.
 // Elke boom krijgt een unieke stam, kroon, takstand, leeftijd en open plekken.
 // Kansverdeling per nieuw bos, onafhankelijk voor elke boom.
 // Grove den 16%, spar 16%, eik 18%, berk 18%, treurwilg 16%, beuk 16%.
 const species=[['grove den',16],['spar',16],['eik',18],['berk',18],['treurwilg',16],['beuk',16]];
 function randomSpecies(){let n=Math.random()*100;for(const [name,chance] of species){n-=chance;if(n<0)return name}return 'beuk'}
 const items=[];
 // Een nieuw beeld krijgt een eigen bosritme: open stroken en boomgroepen.
 // Geen vast raster of vaste aantallen meer.
 const gaps=Array.from({length:I(1,4)},()=>({x:R(100,900),width:R(105,230)}));
 const groups=Array.from({length:I(2,5)},()=>({x:R(70,930),spread:R(55,170)}));
 for(let row=0;row<2;row++){
  const amount=row===0?I(13,29):I(9,22);
  for(let i=0;i<amount;i++){
   let x;
   if(Math.random()<.62){
    const g=groups[I(0,groups.length)];
    x=g.x+R(-g.spread,g.spread);
   }else x=R(20,980);
   // In een open strook blijven minder bomen staan.
   if(gaps.some(g=>Math.abs(x-g.x)<g.width*.5) && Math.random()<.84)continue;
   x=Math.max(18,Math.min(982,x));
   let type=randomSpecies();

const shadeCanvas=document.getElementById('shade'),sg=shadeCanvas.getContext('2d');
function updateForestLight(){
 const value=+document.getElementById('forestLight').value;
 document.getElementById('lightVal').textContent=(value>0?'+':'')+value;
 sg.clearRect(0,0,1000,1000);
 if(!value)return;
 const alpha=Math.min(.75,Math.abs(value)/100);
 const grad=sg.createLinearGradient(0,520,0,790);
 const rgb=value<0?'0,7,15':'205,220,186';
 grad.addColorStop(0,`rgba(${rgb},0)`);
 grad.addColorStop(1,`rgba(${rgb},${alpha})`);
 sg.fillStyle=grad;sg.fillRect(0,520,1000,480);
}
document.getElementById('forestLight').oninput=updateForestLight;
